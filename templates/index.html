<!DOCTYPE html>
<html>
<head>
    <title>Jarvis AI</title>
</head>
<body>

<h1>Jarvis AI</h1>

<form action="/chat" method="post">

    <input
        type="text"
        name="message"
        placeholder="Type message"
        required
    >

    <button type="submit">
        Send
    </button>

</form>

{% if response %}
<hr>
<h3>Response:</h3>
<p>{{ response }}</p>
{% endif %}

</body>
</html>
